name: x86_64 - debug

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
  workflow_call:

jobs:
  build:
    name: Build x86_64 debug
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      JAVA_VERSION: 17
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
      - run: chmod +x android/gradlew
      - name: Build APK
        env:
          ABI: x86_64
          DISPLAY: x86_64
        run: |
          cd android
          ./gradlew assembleDebug -Pabi=$ABI
          cp app/build/outputs/apk/debug/*.apk solara-${DISPLAY}-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: solara-x86_64-debug'
          path: android/solara-x86_64-debug.apk
          retention-days: 30
