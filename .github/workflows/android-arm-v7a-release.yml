name: arm-v7a - release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  workflow_call:

jobs:
  build:
    name: Build arm-v7a release
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      JAVA_VERSION: 17
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
      - run: chmod +x android/gradlew
      - name: Build APK
        env:
          ABI: armeabi-v7a
          DISPLAY: arm-v7a
        run: |
          cd android
          ./gradlew assembleRelease -Pabi=$ABI
          cp app/build/outputs/apk/release/*.apk solara-${DISPLAY}-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: solara-arm-v7a-release
          path: android/solara-arm-v7a-release.apk
          retention-days: 30
