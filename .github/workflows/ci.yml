name: CI

on:
  push:
    branches: [ master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - pre-release
          - beta
          - dev

jobs:
  version:
    name: Set version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
      version_type: ${{ steps.version.outputs.VERSION_TYPE }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          RELEASE_VERSION=$(grep "release" version.txt | head -1 | cut -d' ' -f1)
          PRERELEASE_VERSION=$(grep "pre-release" version.txt | head -1 | cut -d' ' -f1)
          BETA_VERSION=$(grep "beta" version.txt | head -1 | cut -d' ' -f1)
          DEV_VERSION=$(grep "dev" version.txt | head -1 | cut -d' ' -f1)

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
            if [[ "$TAG_NAME" == *-rc* ]] || [[ "$TAG_NAME" == *-pre* ]]; then
              VERSION="$PRERELEASE_VERSION-rc"
              TYPE="pre-release"
            elif [[ "$TAG_NAME" == *-beta* ]]; then
              VERSION="$BETA_VERSION-beta"
              TYPE="beta"
            else
              VERSION="$RELEASE_VERSION"
              TYPE="release"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TYPE="${{ inputs.version_type }}"
            case "$TYPE" in
              "release") VERSION="$RELEASE_VERSION" ;;
              "pre-release") VERSION="$PRERELEASE_VERSION-rc" ;;
              "beta") VERSION="$BETA_VERSION-beta" ;;
              "dev") VERSION="$DEV_VERSION-dev" ;;
            esac
          else
            VERSION="$RELEASE_VERSION"
            TYPE="release"
          fi

          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_TYPE=$TYPE" >> $GITHUB_OUTPUT

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew ktlintCheck
      - run: cd android && ./gradlew lint
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: android/app/build/reports/
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [version, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew testDebugUnitTest
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
          retention-days: 7

  call-arm-v7a-release:
    name: Build arm-v7a release
    needs: [version, lint, test]
    if: contains(fromJson('["release", "pre-release"]'), needs.version.outputs.version_type)
    uses: ./.github/workflows/android-arm-v7a-release.yml
    with:
      app_version: ${{ needs.version.outputs.app_version }}
      version_type: ${{ needs.version.outputs.version_type }}
    secrets: inherit

  call-arm-v8a-release:
    name: Build arm-v8a release
    needs: [version, lint, test]
    if: contains(fromJson('["release", "pre-release"]'), needs.version.outputs.version_type)
    uses: ./.github/workflows/android-arm-v8a-release.yml
    with:
      app_version: ${{ needs.version.outputs.app_version }}
      version_type: ${{ needs.version.outputs.version_type }}
    secrets: inherit

  call-x86-release:
    name: Build x86 release
    needs: [version, lint, test]
    if: contains(fromJson('["release", "pre-release"]'), needs.version.outputs.version_type)
    uses: ./.github/workflows/android-x86-release.yml
    with:
      app_version: ${{ needs.version.outputs.app_version }}
      version_type: ${{ needs.version.outputs.version_type }}
    secrets: inherit

  call-x86_64-release:
    name: Build x86_64 release
    needs: [version, lint, test]
    if: contains(fromJson('["release", "pre-release"]'), needs.version.outputs.version_type)
    uses: ./.github/workflows/android-x86_64-release.yml
    with:
      app_version: ${{ needs.version.outputs.app_version }}
      version_type: ${{ needs.version.outputs.version_type }}
    secrets: inherit

  call-arm-v7a-debug:
    name: Build arm-v7a debug
    needs: [version, lint, test]
    if: contains(fromJson('["dev", "beta", "pre-release"]'), needs.version.outputs.version_type)
    uses: ./.github/workflows/android-arm-v7a-debug.yml
    with:
      app_version: ${{ needs.version.outputs.app_version }}
      version_type: ${{ needs.version.outputs.version_type }}
    secrets: inherit

  call-arm-v8a-debug:
    name: Build arm-v8a debug
    needs: [version, lint, test]
    if: contains(fromJson('["dev", "beta", "pre-release"]'), needs.version.outputs.version_type)
    uses: ./.github/workflows/android-arm-v8a-debug.yml
    with:
      app_version: ${{ needs.version.outputs.app_version }}
      version_type: ${{ needs.version.outputs.version_type }}
    secrets: inherit

  call-x86-debug:
    name: Build x86 debug
    needs: [version, lint, test]
    if: contains(fromJson('["dev", "beta", "pre-release"]'), needs.version.outputs.version_type)
    uses: ./.github/workflows/android-x86-debug.yml
    with:
      app_version: ${{ needs.version.outputs.app_version }}
      version_type: ${{ needs.version.outputs.version_type }}
    secrets: inherit

  call-x86_64-debug:
    name: Build x86_64 debug
    needs: [version, lint, test]
    if: contains(fromJson('["dev", "beta", "pre-release"]'), needs.version.outputs.version_type)
    uses: ./.github/workflows/android-x86_64-debug.yml
    with:
      app_version: ${{ needs.version.outputs.app_version }}
      version_type: ${{ needs.version.outputs.version_type }}
    secrets: inherit

  call-universal:
    name: Build universal
    needs:
      - version
      - call-arm-v7a-release
      - call-arm-v8a-release
      - call-x86-release
      - call-x86_64-release
      - call-arm-v7a-debug
      - call-arm-v8a-debug
      - call-x86-debug
      - call-x86_64-debug
    if: always() && !cancelled()
    uses: ./.github/workflows/android-universal.yml
    with:
      app_version: ${{ needs.version.outputs.app_version }}
      version_type: ${{ needs.version.outputs.version_type }}
    secrets: inherit

  call-release:
    name: Create draft release
    needs: [version, call-universal]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      app_version: ${{ needs.version.outputs.app_version }}
      version_type: ${{ needs.version.outputs.version_type }}
    secrets: inherit
