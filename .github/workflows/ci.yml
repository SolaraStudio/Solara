name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  version:
    name: Set version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
      version_type: ${{ steps.version.outputs.VERSION_TYPE }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          RELEASE_VERSION=$(grep "release" version.txt | head -1 | cut -d' ' -f1)
          PRERELEASE_VERSION=$(grep "pre-release" version.txt | head -1 | cut -d' ' -f1)
          BETA_VERSION=$(grep "beta" version.txt | head -1 | cut -d' ' -f1)
          DEV_VERSION=$(grep "dev" version.txt | head -1 | cut -d' ' -f1)

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
            if [[ "$TAG_NAME" == *-rc* ]] || [[ "$TAG_NAME" == *-pre* ]]; then
              VERSION="$PRERELEASE_VERSION-rc"
              TYPE="pre-release"
            elif [[ "$TAG_NAME" == *-beta* ]]; then
              VERSION="$BETA_VERSION-beta"
              TYPE="beta"
            else
              VERSION="$RELEASE_VERSION"
              TYPE="release"
            fi
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            VERSION="$DEV_VERSION-dev"
            TYPE="dev"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="$DEV_VERSION-dev"
            TYPE="dev"
          else
            VERSION="$RELEASE_VERSION"
            TYPE="release"
          fi

          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_TYPE=$TYPE" >> $GITHUB_OUTPUT

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew ktlintCheck
      - run: cd android && ./gradlew lint
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: android/app/build/reports/
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [version, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew testDebugUnitTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
          retention-days: 7
