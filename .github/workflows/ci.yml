name: CI

on:
  push:
    branches: [ master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_VERSION: 17
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false

jobs:
  version:
    name: Set version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
      version_code: ${{ steps.version.outputs.VERSION_CODE }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          BASE_VERSION=$(cat version.txt | head -1 | cut -d' ' -f1)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            VERSION="${BASE_VERSION}-dev"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="${BASE_VERSION}-pr"
          else
            VERSION="${BASE_VERSION}"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version set to: $VERSION"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: chmod +x android/gradlew

      # ---- Auto-formatting step ----
      - name: Auto-format with ktlint
        run: |
          cd android
          ./gradlew ktlintFormat
        continue-on-error: false

      - name: Check for formatting changes
        id: check-format
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "formatted=true" >> $GITHUB_OUTPUT
          else
            echo "formatted=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit formatting changes
        if: steps.check-format.outputs.formatted == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Apply ktlint formatting [skip ci]"
          commit_user_name: "Solara Bot"
          commit_user_email: "bot@solara.studio"
          commit_author: "frostre1997"
        env:
          GITHUB_TOKEN: ${{secrets.BOT_TOKEN}}
      - run: cd android && ./gradlew ktlintCheck
      - run: cd android && ./gradlew lint
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: android/app/build/reports/
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [version, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew testDebugUnitTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
          retention-days: 7

  build-per-abi:
    name: Build release APK for ${{ matrix.display }}
    runs-on: ubuntu-latest
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
        include:
          - abi: armeabi-v7a
            display: arm-v7a
          - abi: arm64-v8a
            display: arm-v8a
          - abi: x86
            display: x86
          - abi: x86_64
            display: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: chmod +x android/gradlew
      - env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
        run: |
          cd android
          ./gradlew assembleRelease -Pabi=${{ matrix.abi }}
          cp app/build/outputs/apk/release/*.apk solara-${APP_VERSION}-${{ matrix.display }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: solara-${{ matrix.display }}
          path: android/solara-${{ needs.version.outputs.app_version }}-${{ matrix.display }}.apk
          retention-days: 30

  build-debug:
    name: Build universal debug APK
    runs-on: ubuntu-latest
    needs: [version, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: chmod +x android/gradlew
      - env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
        run: |
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/*.apk solara-${APP_VERSION}-debug-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: solara-debug-universal
          path: android/solara-${{ needs.version.outputs.app_version }}-debug-universal.apk
          retention-days: 30

  build-aab:
    name: Build release AAB
    runs-on: ubuntu-latest
    needs: [version, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: chmod +x android/gradlew
      - env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
        run: |
          cd android
          ./gradlew bundleRelease
          cp app/build/outputs/bundle/release/*.aab solara-${APP_VERSION}-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: solara-release-aab
          path: android/solara-${{ needs.version.outputs.app_version }}-release.aab
          retention-days: 30

  sign-and-release:
    name: Sign and release
    runs-on: ubuntu-latest
    needs: [build-per-abi, build-aab]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
      - env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for apk in artifacts/solara-*/solara-*.apk; do
            jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
              -keystore keystore.jks \
              -storepass $KEYSTORE_PASSWORD \
              -keypass $KEY_PASSWORD \
              "$apk" $KEY_ALIAS
            $ANDROID_HOME/build-tools/35.0.0/zipalign -v -p 4 "$apk" "${apk%.apk}-signed.apk"
          done
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore keystore.jks \
            -storepass $KEYSTORE_PASSWORD \
            -keypass $KEY_PASSWORD \
            artifacts/solara-release-aab/*.aab $KEY_ALIAS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*-signed.apk
            artifacts/solara-release-aab/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
