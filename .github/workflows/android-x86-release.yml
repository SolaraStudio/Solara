name: x86 - release

on:
  workflow_call:
    inputs:
      app_version:
        description: "App version"
        required: true
        type: string
      version_type:
        description: "Version type"
        required: true
        type: string

jobs:
  build:
    name: Build x86 release
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      JAVA_VERSION: 17
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
      - run: chmod +x android/gradlew
      - name: Build APK
        env:
          ABI: x86
          DISPLAY: x86
        run: |
          cd android
          ./gradlew assembleRelease -Pabi=$ABI
          cp app/build/outputs/apk/release/*.apk solara-${DISPLAY}-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: solara-x86-release-${{ inputs.app_version }}
          path: android/solara-x86-release.apk
          retention-days: 30
