name: universal

on:
  workflow_call:
    inputs:
      app_version:
        description: "App version"
        required: true
        type: string
      version_type:
        description: "Version type"
        required: true
        type: string

jobs:
  build:
    name: Build universal (${{ inputs.version_type }})
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      JAVA_VERSION: 17
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
      - run: chmod +x android/gradlew

      - name: Build universal APK
        run: |
          cd android
          # Build both variants
          ./gradlew assembleRelease
          ./gradlew assembleDebug

          # Find the APK files
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)

          if [ -z "$RELEASE_APK" ]; then
            echo "Release APK not found!"
            exit 1
          fi
          if [ -z "$DEBUG_APK" ]; then
            echo "Debug APK not found!"
            exit 1
          fi

          VERSION_TYPE="${{ inputs.version_type }}"
          echo "Version type: $VERSION_TYPE"

          case "$VERSION_TYPE" in
            "release")
              cp "$RELEASE_APK" solara-universal-release.apk
              ;;
            "pre-release")
              cp "$RELEASE_APK" solara-universal-pre-release.apk
              cp "$DEBUG_APK" solara-universal-pre-release.apk
              ;;
            "dev")
              cp "$DEBUG_APK" solara-universal-dev.apk
              ;;
            "beta")
              cp "$DEBUG_APK" solara-universal-beta.apk
              ;;
            *)
              echo "Unknown version type: $VERSION_TYPE"
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: solara-universal-${{ inputs.version_type }}-${{ inputs.app_version }}
          path: android/solara-universal-*.apk
          retention-days: 30
