name: Setup JDK
description: Install a JDK for Android builds
inputs:
  java-version:
    description: JDK version
    required: false
    default: '17'
  distribution:
    description: JDK distribution
    required: false
    default: temurin
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}
