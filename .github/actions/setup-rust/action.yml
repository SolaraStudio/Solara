name: Setup Rust
description: Install Rust toolchain with Android targets
inputs:
  targets:
    description: Comma-separated Rust targets
    required: false
    default: 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android'
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}
